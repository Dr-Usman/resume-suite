name: Build Resume PDF

on:
  push:
    branches: [ main ]
    paths:
      - 'resume.html'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Compile HTML to PDF via Headless Chrome
        run: |
          chrome \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --no-margins \
            --no-pdf-header-footer \
            --print-to-pdf="Usman_Shahbaz_Senior_Mobile_AI_Engineer_Resume.pdf" \
            "file://$(pwd)/resume.html"

      - name: Verify PDF Generated
        run: |
          ls -lh Usman_Shahbaz_Senior_Mobile_AI_Engineer_Resume.pdf
          file Usman_Shahbaz_Senior_Mobile_AI_Engineer_Resume.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Usman_Shahbaz_Senior_Mobile_AI_Engineer_Resume
          path: Usman_Shahbaz_Senior_Mobile_AI_Engineer_Resume.pdf
